name: Test gates

on:
  push:
  workflow_dispatch:
    inputs:
      gate:
        description: Test gate to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - build
          - native
          - all

permissions:
  contents: read

concurrency:
  group: test-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'push' || inputs.gate == 'fast' || inputs.gate == 'all'
    name: Fast Jest and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run fast gate
        run: npm run test:fast

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'build' || inputs.gate == 'all')
    name: Expo and website build gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm --prefix website ci
      - name: Run build gate
        run: npm run test:build

  native:
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'native' || inputs.gate == 'all')
    name: Android native compilation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Run native gate
        run: npm run test:native
