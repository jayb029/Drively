name: Publish Expo OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel to publish to
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Short description of the update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: expo-ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }} OTA update
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require main for production updates
        if: inputs.channel == 'production'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production OTA updates must be run from the main branch."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Android JavaScript and assets export
        run: npx expo export --platform android

      - name: Publish OTA update
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          eas update \
            --channel "$UPDATE_CHANNEL" \
            --platform android \
            --message "$UPDATE_MESSAGE" \
            --json \
            --non-interactive \
            > "$RUNNER_TEMP/eas-update.json"

          jq empty "$RUNNER_TEMP/eas-update.json"

      - name: Register OTA update on the matching GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          TAG_NAME="v${VERSION_NAME}"
          ASSET_NAME="Drively-v${VERSION_NAME}-ota-${UPDATE_CHANNEL}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.json"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME does not exist. Publish the matching APK release before its OTA update."
            exit 1
          fi

          jq \
            --arg version "$VERSION_NAME" \
            --arg channel "$UPDATE_CHANNEL" \
            --arg message "$UPDATE_MESSAGE" \
            --arg commit "$GITHUB_SHA" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schemaVersion: 1,
              version: $version,
              channel: $channel,
              message: $message,
              commit: $commit,
              publishedAt: $published_at,
              workflowRun: $workflow_run,
              eas: .
            }' \
            "$RUNNER_TEMP/eas-update.json" \
            > "$ASSET_PATH"

          gh release upload "$TAG_NAME" "$ASSET_PATH#$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          {
            echo "## Expo OTA update published"
            echo
            echo "- Channel: \`$UPDATE_CHANNEL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Message: $UPDATE_MESSAGE"
            echo "- GitHub release: \`${{ steps.github_release.outputs.tag_name }}\`"
            echo "- Metadata asset: \`${{ steps.github_release.outputs.asset_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
