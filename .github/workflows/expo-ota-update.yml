name: Publish Expo OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel to publish to
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Short description of the update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: expo-ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }} OTA update
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require main for production updates
        if: inputs.channel == 'production'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production OTA updates must be run from the main branch."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Android JavaScript and assets export
        run: npx expo export --platform android

      - name: Publish OTA update
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: >-
          eas update
          --channel "$UPDATE_CHANNEL"
          --platform android
          --message "$UPDATE_MESSAGE"
          --non-interactive

      - name: Write job summary
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          {
            echo "## Expo OTA update published"
            echo
            echo "- Channel: \`$UPDATE_CHANNEL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Message: $UPDATE_MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
